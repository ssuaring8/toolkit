    // Function to generate HTML based on the data
    function generateHTML() {
      const container = document.getElementById("container");

      // Loop through each category
      for (const category in data) {
        const section = document.createElement("div");
        section.className = "section";

        // Add the category title
        const title = document.createElement("h2");
        title.textContent = data[category].title;
        section.appendChild(title);

        // Loop through topics and create buttons
        data[category].topics.forEach((topic, index) => {
          const button = createTopicButton(topic, category, index);
          section.appendChild(button);
        });

        // Add "Add Topic" button at the bottom of each section
        const addButton = document.createElement("button");
        addButton.className = "add-button";
        addButton.textContent = "Add Topic";
        addButton.onclick = () => addNewTopic(category, addButton);
        section.appendChild(addButton);

        // Add the section to the container
        container.appendChild(section);
      }
    }

    // Function to create a topic button
    function createTopicButton(topic, category, index) {
      const button = document.createElement("button");
      button.textContent = topic.name;
      button.onclick = () => copyResponse(topic.response);

      // Add hover event to show modal
      let modalTimeout;
      button.addEventListener("mouseenter", (e) => {
        const modal = document.getElementById("edit-modal");
        modal.style.display = "block";
        modal.style.left = `${e.clientX}px`;
        modal.style.top = `${e.clientY}px`;

        // Populate modal with current topic and response
        document.getElementById("edit-topic").value = topic.name;
        document.getElementById("edit-response").value = topic.response;

        // Save changes when the save button is clicked
        document.getElementById("save-changes").onclick = () => {
          topic.name = document.getElementById("edit-topic").value;
          topic.response = document.getElementById("edit-response").value;
          button.textContent = topic.name; // Update button text
          saveToLocalStorage(); // Save changes to localStorage
        };

        // Delete topic when the delete button is clicked
        document.getElementById("delete-topic").onclick = () => {
          data[category].topics.splice(index, 1); // Remove the topic from the data
          button.remove(); // Remove the button from the DOM
          saveToLocalStorage(); // Save changes to localStorage
          modal.style.display = "none"; // Hide the modal
        };

        // Clear timeout if modal is already open
        clearTimeout(modalTimeout);
      });

      // Hide modal 3 seconds after mouse leaves the button
      button.addEventListener("mouseleave", () => {
        const modal = document.getElementById("edit-modal");
        modalTimeout = setTimeout(() => {
          if (!modal.matches(":hover")) {
            modal.style.display = "none";
          }
        }, 3000); // 3000 milliseconds = 3 seconds
      });

      // Keep modal open if it is hovered
      const modal = document.getElementById("edit-modal");
      modal.addEventListener("mouseenter", () => {
        clearTimeout(modalTimeout);
      });

      modal.addEventListener("mouseleave", () => {
        modalTimeout = setTimeout(() => {
          modal.style.display = "none";
        }, 3000); // 3000 milliseconds = 3 seconds
      });

      return button;
    }

    // Function to add a new topic button
    function addNewTopic(category, addButton) {
      const newTopic = {
        name: "New Topic",
        response: "Response for New Topic",
      };
      data[category].topics.push(newTopic);

      // Create the new button
      const newButton = createTopicButton(newTopic, category, data[category].topics.length - 1);

      // Insert the new button above the "Add Topic" button
      addButton.parentElement.insertBefore(newButton, addButton);

      // Save changes to localStorage
      saveToLocalStorage();
    }

    // Function to copy response to clipboard
    function copyResponse(text) {
      navigator.clipboard.writeText(text).catch((err) => {
        console.error("Failed to copy text: ", err);
      });
    }

    // Function to copy notes to clipboard
    function copyNotes() {
      const notes = document.getElementById("notes").value;
      navigator.clipboard.writeText(notes).catch((err) => {
        console.error("Failed to copy notes: ", err);
      });
    }

    // Function to clear notes
    function clearNotes() {
      document.getElementById("notes").value = "";
      localStorage.setItem("notes", ""); // Clear notes from localStorage
    }

    // Function to copy customer note to clipboard
    function copyCustomerNote() {
      const customerNote = document.getElementById("customer-note").value;
      navigator.clipboard.writeText(customerNote).catch((err) => {
        console.error("Failed to copy text: ", err);
      });
    }

    // Function to save data to localStorage
    function saveToLocalStorage() {
      localStorage.setItem("data", JSON.stringify(data));
      localStorage.setItem("notes", document.getElementById("notes").value);
      localStorage.setItem("customer-note", document.getElementById("customer-note").value);
      localStorage.setItem("item-cost", document.getElementById("item-cost").value);
      localStorage.setItem("discount", document.getElementById("discount").value);
      localStorage.setItem("dtk-percent", document.getElementById("dtk-percent").value);
      localStorage.setItem("final-dtk", document.getElementById("final-dtk").value);
      localStorage.setItem("currentPrice", document.getElementById("currentPrice").value);
      localStorage.setItem("salePrice", document.getElementById("salePrice").value);
      localStorage.setItem("discountPercentage", document.getElementById("discountPercentage").textContent);
    }

    // Function to load data from localStorage
    function loadFromLocalStorage() {
      const savedData = localStorage.getItem("data");
      if (savedData) {
        Object.assign(data, JSON.parse(savedData));
      }

      // Load notes
      const notes = localStorage.getItem("notes");
      if (notes !== null) {
        document.getElementById("notes").value = notes;
      }

      // Load customer note
      const customerNote = localStorage.getItem("customer-note");
      if (customerNote !== null) {
        document.getElementById("customer-note").value = customerNote;
      }

      // Load DTK Calculator values
      document.getElementById("item-cost").value = localStorage.getItem("item-cost") || "200.08";
      document.getElementById("discount").value = localStorage.getItem("discount") || "5";
      document.getElementById("dtk-percent").value = localStorage.getItem("dtk-percent") || "30";
      document.getElementById("final-dtk").value = localStorage.getItem("final-dtk") || "";

      // Load Quote Tool values
      document.getElementById("currentPrice").value = localStorage.getItem("currentPrice") || "";
      document.getElementById("salePrice").value = localStorage.getItem("salePrice") || "";
      document.getElementById("discountPercentage").textContent = localStorage.getItem("discountPercentage") || "0";
    }

    // Function to update Manila Time and NI
    function updateInfoBar() {
      const manilaTimeElement = document.getElementById("manila-time");
      const niElement = document.getElementById("ni");

      // Get Manila Time
      const manilaTime = new Date().toLocaleString("en-US", {
        timeZone: "Asia/Manila",
        hour12: true,
        hour: "numeric",
        minute: "numeric",
        second: "numeric",
      });
      manilaTimeElement.textContent = `Manila Time: ${manilaTime}`;

      // Get NI (Network Information)
      const ni = navigator.connection
        ? `Network Type: ${navigator.connection.effectiveType}, Downlink: ${navigator.connection.downlink} Mbps`
        : "Network Information: Not available";
      niElement.textContent = `NI: ${ni}`;
    }

    // Function to calculate DTK
    function calculateDTK() {
      const itemCost = parseFloat(document.getElementById("item-cost").value) || 0;
      const discount = parseFloat(document.getElementById("discount").value) || 0;
      const dtkPercent = parseFloat(document.getElementById("dtk-percent").value) || 0;

      const finalDTK = (itemCost - discount) * (dtkPercent / 100) * 1.1;
      document.getElementById("final-dtk").value = finalDTK.toFixed(2);
      saveToLocalStorage(); // Save DTK values to localStorage
    }

    // Function to calculate Discount Percentage
    function calculateDiscount() {
      const currentPrice = parseFloat(document.getElementById("currentPrice").value);
      const salePrice = parseFloat(document.getElementById("salePrice").value);

      if (isNaN(currentPrice) || isNaN(salePrice) || currentPrice <= 0) {
        document.getElementById("discountPercentage").textContent = '0';
        return;
      }

      if (salePrice > currentPrice) {
        document.getElementById("discountPercentage").textContent = '0';
        return;
      }

      const discountPercentage = ((currentPrice - salePrice) / currentPrice) * 100;
      document.getElementById("discountPercentage").textContent = discountPercentage;
      saveToLocalStorage(); // Save Quote Tool values to localStorage
    }

    // Event listeners for DTK calculator
    document.getElementById("item-cost").addEventListener("input", calculateDTK);
    document.getElementById("discount").addEventListener("input", calculateDTK);
    document.getElementById("dtk-percent").addEventListener("input", calculateDTK);

    // Event listeners for Quote Tool calculator
    document.getElementById("currentPrice").addEventListener("input", calculateDiscount);
    document.getElementById("salePrice").addEventListener("input", calculateDiscount);

    // Auto-save functionality for Notes and Customer Note Format
    document.getElementById("notes").addEventListener("input", saveToLocalStorage);
    document.getElementById("customer-note").addEventListener("input", saveToLocalStorage);

    // Hide modal when clicking outside of it
    document.addEventListener("click", (e) => {
      const modal = document.getElementById("edit-modal");
      if (!modal.contains(e.target) && !e.target.classList.contains("section-button")) {
        modal.style.display = "none";
      }
    });

    // Update Manila Time and NI every second
    setInterval(updateInfoBar, 1000);

    // Generate the HTML when the page loads
    loadFromLocalStorage();
    generateHTML();
    updateInfoBar(); // Initial call to display Manila Time and NI
    calculateDTK(); // Initial call to calculate DTK
    calculateDiscount(); // Initial call to calculate Discount Percentage
